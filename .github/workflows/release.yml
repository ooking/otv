name: 发布 APK 到 Releases

# 仅支持手动触发，不自动执行
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本标签（留空则自动读取 app/build.gradle 中的 versionName，如 v1.0.0）"
        required: false
        default: ""
        type: string
      prerelease:
        description: "是否标记为预发布版本 (Pre-release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 解析版本号与标签
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            VER=$(grep -E "versionName\s+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "发布标签: ${TAG}"

      - name: 运行单元测试
        run: |
          ./gradlew compileDebugJavaWithJavac compileDebugUnitTestJavaWithJavac
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-35/android.jar"
          CP="app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:app/build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes:${ANDROID_JAR}"
          java -cp "$CP" com.xiaomitv.dtmb.AppLanguageTest
          java -cp "$CP" com.xiaomitv.dtmb.ChannelManagerTest

      - name: 编译并准备 APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OUT_APK="OTV-${TAG}.apk"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            # 若已配置签名 Secrets，则构建正式 Release 并签名
            ./gradlew assembleRelease
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
            ZIPALIGN=$(find "${ANDROID_HOME}/build-tools" -name zipalign | sort -V | tail -n 1)
            "$ZIPALIGN" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "${OUT_APK}" \
              aligned.apk
            rm -f release.keystore aligned.apk
          else
            # 未配置签名密钥时，构建可直接安装的 Debug APK
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "${OUT_APK}"
          fi

          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"
          ls -lh "${OUT_APK}"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OTV ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.build.outputs.apk_path }}
