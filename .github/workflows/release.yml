name: 发布 APK 到 Releases

# 仅支持手动触发，不自动执行
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本标签（留空则自动读取 app/build.gradle 中的 versionName，如 v1.0.0）"
        required: false
        default: ""
        type: string
      changelog:
        description: "可选补充说明（填写后会置顶展示在自动生成的 Git 更新日志上方）"
        required: false
        default: ""
        type: string
      prerelease:
        description: "是否标记为预发布版本 (Pre-release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码与完整标签历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 解析版本号与标签
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          RAW_TAG="$(echo "${INPUT_TAG}" | xargs)"
          if [ -z "$RAW_TAG" ]; then
            VER=$(grep -E "versionName[[:space:]]+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
            TAG="v${VER}"
          else
            VER="${RAW_TAG#[vV]}"
            if [[ "$RAW_TAG" =~ ^[0-9] ]]; then
              TAG="v${RAW_TAG}"
            else
              TAG="${RAW_TAG}"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "发布标签: ${TAG} (APK 内部版本号: ${VER})"

      - name: 编译并准备 APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.version }}"
          OUT_APK="OTV-${TAG}.apk"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            # 若已配置签名 Secrets，则构建正式 Release 并注入本次发布版本号
            ./gradlew assembleRelease -PappVersionName="${VER}"
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
            ZIPALIGN=$(find "${ANDROID_HOME}/build-tools" -name zipalign | sort -V | tail -n 1)
            "$ZIPALIGN" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "${OUT_APK}" \
              aligned.apk
            rm -f release.keystore aligned.apk
          else
            # 未配置签名密钥时，构建可直接安装的 Debug APK 并注入本次发布版本号
            ./gradlew assembleDebug -PappVersionName="${VER}"
            cp app/build/outputs/apk/debug/app-debug.apk "${OUT_APK}"
          fi

          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"
          ls -lh "${OUT_APK}"

      - name: 生成版本更新日志 (Changelog)
        env:
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
          EXTRA_NOTES: ${{ inputs.changelog }}
          APK_FILE: ${{ steps.build.outputs.apk_path }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, subprocess

          current_tag = os.environ["CURRENT_TAG"].strip()
          extra_notes = os.environ.get("EXTRA_NOTES", "").strip()
          apk_file = os.environ["APK_FILE"].strip()
          repo = os.environ["REPO"].strip()

          # 查找上一个已发布的版本标签（排除当前正在发布的同名版本）
          same_ver = {current_tag, current_tag.lstrip("v"), "v" + current_tag.lstrip("v")}
          tags_out = subprocess.check_output(
              ["git", "tag", "--sort=-creatordate"], text=True
          ).splitlines()
          prev_tag = next((t.strip() for t in tags_out if t.strip() and t.strip() not in same_ver), "")

          # 读取区间内的提交记录
          cmd = ["git", "log", "--no-merges", "--pretty=format:%s\t%h"]
          if prev_tag:
              cmd.append(f"{prev_tag}..HEAD")
          else:
              cmd.extend(["-n", "30"])
          raw_commits = subprocess.check_output(cmd, text=True).splitlines()

          groups = {
              "新增功能": [],
              "体验优化": [],
              "问题修复": [],
              "其他更新": [],
          }

          for line in raw_commits:
              if "\t" not in line:
                  continue
              subject, short_hash = line.split("\t", 1)
              subject = subject.strip()
              if not subject:
                  continue
              cleaned = re.sub(r"^[^\w\u4e00-\u9fff]+", "", subject).strip()
              item = f"- {subject} (`{short_hash}`)"
              if re.match(r"^(新增|feat\b)", cleaned, re.IGNORECASE):
                  groups["新增功能"].append(item)
              elif re.match(r"^(优化|重构|perf\b|refactor\b)", cleaned, re.IGNORECASE):
                  groups["体验优化"].append(item)
              elif re.match(r"^(修复|fix\b)", cleaned, re.IGNORECASE):
                  groups["问题修复"].append(item)
              else:
                  groups["其他更新"].append(item)

          sections = []
          if extra_notes:
              sections.append(f"## 版本说明\n\n{extra_notes}")

          changelog_lines = []
          for title, items in groups.items():
              if items:
                  changelog_lines.append(f"### {title}\n" + "\n".join(items))

          if changelog_lines:
              sections.append("## 更新内容\n\n" + "\n\n".join(changelog_lines))
          elif not extra_notes:
              sections.append("## 更新内容\n\n- 常规维护与体验优化")

          # 计算安装包大小与 SHA-256 校验值
          size_bytes = os.path.getsize(apk_file)
          size_kb = f"{size_bytes / 1024:.0f} KB"
          sha256 = hashlib.sha256(open(apk_file, "rb").read()).hexdigest()
          asset_lines = [
              "## 安装包信息",
              "",
              f"- **文件**：`{apk_file}`（{size_kb}）",
              f"- **SHA-256**：`{sha256}`",
          ]
          if prev_tag:
              asset_lines.append(
                  f"- **完整变更对比**：[{prev_tag}...{current_tag}](https://github.com/{repo}/compare/{prev_tag}...{current_tag})"
              )
          sections.append("\n".join(asset_lines))

          notes = "\n\n".join(sections) + "\n"
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          print(notes)
          PY

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OTV ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.build.outputs.apk_path }}
